[package]
name = "control-math"
description = "A self-contained library of arithmetic: Vec3, Quat, a dense row-major Mat, a deterministic MT19937 stream, the constant-Hessian QP solvers and damped least squares over a Jacobian. Pure arithmetic, no model, no plant."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rand_mt = { version = "6.0.3", default-features = false }

[lints.clippy]
# The one default lint this crate does not follow: the matrix kernels index parallel arrays by a
# MODEL count — `rows`, `cols` — not by a slice's length, so the index is the maths the loop is
# written in.
needless_range_loop = "allow"
