[package]
name = "control-math"
description = "The math basis of the control stack: Vec3, Quat, a dense row-major Mat, and the deterministic MT19937 stream the estimator benches draw from. Pure arithmetic, no model, no plant."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rand_mt = { version = "6.0.3", default-features = false }

[lints.clippy]
# The one default lint this crate does not follow: the matrix kernels index parallel arrays by a
# MODEL count — `rows`, `cols` — not by a slice's length, so the index is the maths the loop is
# written in (the same allowance z1-arm and pga carry).
needless_range_loop = "allow"
